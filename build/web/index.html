<html>
    <head>
        <title>Conversor de temperaturas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
     
        <h1>Conversor de Temperaturas</h1>

        <form method="post" action="TemperaturaServlet" >

            <label>Ingrese la temperatura:</label>
            Temperatura <input type="text" name ="temperatura">

            <br><br>

            <label>Seleccione la conversión:</label>

            <select name="conversion">
                <option value="CF">Celsius a Fahrenheit</option>
                <option value="FC">Fahrenheit a Celsius</option>
                <option value="CK">Celsius a Kelvin</option>
                <option value="KC">Kelvin a Celsius</option>
            </select>

            <br><br>

            <input type="submit" value="Convertir">

        </form>
    </body>
</html>
